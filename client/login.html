<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login con Usuario/Contraseña</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Login con Usuario y Contraseña</h1>
        <p>Resource Owner Password Credentials Grant</p>
        
        <div class="login-form">
            <form id="passwordLoginForm">
                <div class="form-group">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" required 
                           placeholder="Ingresa tu usuario" class="form-control">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required 
                           placeholder="Ingresa tu contraseña" class="form-control">
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                    <button type="button" id="backBtn" class="btn btn-secondary">Volver</button>
                </div>
            </form>
        </div>
        
        <div id="status" class="status-container">
            <p>Ingresa tus credenciales</p>
        </div>

        <div class="demo-credentials">
            <h3>Credenciales de Demo:</h3>
            <p><strong>Usuario:</strong> demo@ejemplo.com</p>
            <p><strong>Contraseña:</strong> password123</p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
