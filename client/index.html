<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente OAuth 2.0 </title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Cliente OAuth 2.0 - JA</h1>
        
        <div class="auth-methods">
            <h2>Métodos de Autenticación</h2>
            <div class="button-group">
                <button id="loginBtn" class="btn btn-primary">Authorization Code Grant</button>
                <button id="passwordLoginBtn" class="btn btn-secondary">Password Grant</button>
            </div>
        </div>
        
        <div class="app-actions">
            <h2>Acciones de la Aplicación</h2>
            <div class="button-group">
                <button id="apiBtn" class="btn btn-success">Llamar API Protegida</button>
                <button id="logoutBtn" class="btn btn-danger">Cerrar Sesión</button>
            </div>
        </div>
        
        <div id="status" class="status-container">
            <p>Estado: No autenticado</p>
        </div>

        <div class="session-info">
            <p><strong>Tipo de Grant:</strong> <span id="grantType">N/A</span></p>
        </div>

        <div id="userInfo" class="user-info" style="display: none;">
            <h3>Información del Usuario</h3>
            <div id="userData"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
